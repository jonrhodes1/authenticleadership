const TeamMapSVG = ({ members, generated, synergy, showComm, showSynergy }) => {
  if (!generated) {
    return (
      <div style={{ flex:1, display:'flex', alignItems:'center',
        justifyContent:'center', color:'rgba(255,255,255,0.3)',
        fontSize:'15px', fontStyle:'italic', textAlign:'center' }}>
        Configure your team and<br/>generate the map
      </div>
    );
  }
  const n = members.length;
  const svgSize = 440;
  const cx = svgSize / 2, cy = svgSize / 2;
  const radius = svgSize * 0.36;

  const positions = members.map((_, i) => {
    const angle = (2 * Math.PI * i / n) - Math.PI / 2;
    return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };
  });

  const commStyle = (freq) => {
    if (freq === 4) return { sw: 7,   opacity: 0.92, stroke: C.teal,                dash: 'none' };
    if (freq === 3) return { sw: 4.5, opacity: 0.78, stroke: C.teal,                dash: 'none' };
    if (freq === 2) return { sw: 3,   opacity: 0.55, stroke: 'rgba(156,163,175,1)', dash: 'none' };
    if (freq === 1) return { sw: 1.8, opacity: 0.4,  stroke: 'rgba(156,163,175,1)', dash: 'none' };
    return null; // 0 = Avoid: no line
  };

  const synStyle = (rating) => {
    if (rating === 4) return { sw: 6,   opacity: 0.88, stroke: C.coral };
    if (rating === 3) return { sw: 4,   opacity: 0.72, stroke: C.coral };
    if (rating === 2) return { sw: 2.5, opacity: 0.52, stroke: C.coral };
    if (rating === 1) return { sw: 1.5, opacity: 0.32, stroke: C.coral };
    return null; // 0 = Avoid: no line
  };

  const nodeRadius = (freq) => {
    if (freq === 4) return 20;
    if (freq === 3) return 17;
    if (freq === 2) return 14;
    if (freq === 1) return 11;
    return 10;
  };

  // Build synergy line arrays imperatively to avoid nested-map issues
  const synYouLines = [];
  const synPeerLines = [];
  if (showSynergy) {
    members.forEach((m, i) => {
      const key = `y-${i}`;
      const rating = synergy[key] !== undefined ? synergy[key] : 2;
      const s = synStyle(rating);
      if (s) synYouLines.push({ i, s });
    });
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const key = `${i}-${j}`;
        const rating = synergy[key] !== undefined ? synergy[key] : 2;
        const s = synStyle(rating);
        if (s) synPeerLines.push({ i, j, s });
      }
    }
  }

  return (
    <svg viewBox={`0 0 ${svgSize} ${svgSize}`}
      style={{ width:'100%', maxWidth:'480px', display:'block', margin:'0 auto' }}>

      {/* Guide circle */}
      <circle cx={cx} cy={cy} r={radius}
        fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="1" strokeDasharray="4,6"/>

      {/* COMMUNICATION: spokes from centre to each member */}
      {showComm && members.map((m, i) => {
        const s = commStyle(m.freq);
        if (!s) return null;
        const pos = positions[i];
        return (
          <line key={`comm-${i}`}
            x1={cx} y1={cy} x2={pos.x} y2={pos.y}
            stroke={s.stroke} strokeWidth={s.sw} strokeOpacity={s.opacity}
            strokeDasharray={s.dash}
            style={{ opacity:0, animation:`fadeIn 500ms ease-out ${i*80}ms forwards`,
              animationFillMode:'both' }}
          />
        );
      })}

      {/* SYNERGY: YOU to each member */}
      {synYouLines.map(({ i, s }) => (
        <line key={`syn-you-${i}`}
          x1={cx} y1={cy} x2={positions[i].x} y2={positions[i].y}
          stroke={s.stroke} strokeWidth={s.sw} strokeOpacity={s.opacity}
        />
      ))}

      {/* SYNERGY: peer-to-peer connections */}
      {synPeerLines.map(({ i, j, s }) => (
        <line key={`syn-peer-${i}-${j}`}
          x1={positions[i].x} y1={positions[i].y}
          x2={positions[j].x} y2={positions[j].y}
          stroke={s.stroke} strokeWidth={s.sw} strokeOpacity={s.opacity}
        />
      ))}

      {/* Outer member nodes — drawn above lines */}
      {members.map((m, i) => {
        const pos = positions[i];
        const r = nodeRadius(m.freq);
        const isAvoid = m.freq === 0;
        const fill   = isAvoid ? 'rgba(156,163,175,0.25)' : C.teal;
        const stroke = isAvoid ? 'rgba(156,163,175,0.3)'  : 'rgba(0,240,208,0.4)';
        const textFill = isAvoid ? 'rgba(156,163,175,0.7)' : '#0A0F1C';
        return (
          <g key={`node-${i}`} style={{ opacity:0,
            animation:`nodeAppear 300ms ease-out ${i*100}ms forwards`,
            animationFillMode:'both' }}>
            <circle cx={pos.x} cy={pos.y} r={r}
              fill={fill} stroke={stroke} strokeWidth="1.5"/>
            <text x={pos.x} y={pos.y+1} textAnchor="middle"
              dominantBaseline="middle" fontSize={r >= 17 ? '11' : '9'}
              fontFamily="DM Sans" fontWeight="600" fill={textFill}>
              {(m.name || '?').slice(0,3)}
            </text>
          </g>
        );
      })}

      {/* Centre YOU node */}
      <g style={{ opacity:0, animation:'nodeAppear 400ms ease-out 0ms forwards',
        animationFillMode:'both' }}>
        <circle cx={cx} cy={cy} r="24"
          fill={C.teal} stroke="rgba(0,240,208,0.5)" strokeWidth="3"/>
        <text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle"
          fontSize="12" fontFamily="DM Sans" fontWeight="700" fill="#0A0F1C">
          YOU
        </text>
      </g>
    </svg>
  );
};

/* --- APP --------------------------------------------------- */
const App = () => {
  const [currentSlide, setCurrentSlide] = useState(0);
  const [step, setStep]                 = useState(0);
  const [visible, setVisible]           = useState(true);
  const [showAbout, setShowAbout]       = useState(false);

  // Team map state (shared, persisted across navigation)
  const [teamSize, setTeamSize]             = useState(6);
  const [teamMembers, setTeamMembers]       = useState(
    Array.from({length:6},(_,i)=>({name:String.fromCharCode(65+i),freq:2}))
  );
  const [mapGenerated, setMapGenerated]     = useState(false);

  const goToSlide = useCallback((idx, newStep = 0) => {
    setVisible(false);
    setTimeout(() => {
      setCurrentSlide(idx);
      setStep(newStep);
      setVisible(true);
    }, 300);
  }, []);

  const advance = useCallback(() => {
    const maxSteps = SLIDES[currentSlide].steps;
    if (step < maxSteps) {
      setStep(s => s + 1);
    } else if (currentSlide < SLIDES.length - 1) {
      goToSlide(currentSlide + 1, 0);
    }
  }, [currentSlide, step, goToSlide]);

  const goBack = useCallback(() => {
    if (step > 0) {
      setStep(s => s - 1);
    } else if (currentSlide > 0) {
      goToSlide(currentSlide - 1, SLIDES[currentSlide - 1].steps);
    }
  }, [currentSlide, step, goToSlide]);

  useEffect(() => {
    const handler = (e) => {
      if (showAbout) {
        if (e.key === 'Escape') setShowAbout(false);
        return;
      }
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); advance(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [advance, goBack, showAbout]);

  const generateHandout = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const W = 210, H = 297;
    const margin = 20;
    const contentW = W - margin * 2;

    const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    // Helper: ruled lines
    const ruledLines = (startY, count, d) => {
      d.setDrawColor(200, 200, 200);
      d.setLineWidth(0.3);
      for (let i = 0; i < count; i++) {
        const y = startY + i * 8;
        if (y < H - margin) d.line(margin, y, W - margin, y);
      }
      return startY + count * 8;
    };

    // Helper: section header
    const sectionHeader = (text, y, d) => {
      d.setFont('helvetica', 'bold');
      d.setFontSize(14);
      d.setTextColor(10, 15, 28);
      d.text(text, margin, y);
      d.setDrawColor(0, 137, 123);
      d.setLineWidth(1);
      d.line(margin, y + 3, W - margin, y + 3);
      return y + 12;
    };

    // PAGE 1 -- Cover
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(22);
    doc.setTextColor(10, 15, 28);
    doc.text('FROM PSYCHOLOGICAL SAFETY TO', margin, 50);
    doc.setTextColor(0, 137, 123);
    doc.text('AUTHENTIC LEADERSHIP', margin, 62);
    doc.setDrawColor(200, 200, 200);
    doc.setLineWidth(0.5);
    doc.line(margin, 68, W - margin, 68);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(12);
    doc.setTextColor(100, 100, 100);
    doc.text('Workshop Handout', margin, 76);

    doc.setFontSize(11);
    doc.setTextColor(51, 51, 51);
    const intro = doc.splitTextToSize(
      'This handout accompanies the facilitated workshop experience. It contains reflection prompts, frameworks, and space for your thinking. There are no answers here, only questions worth sitting with.',
      contentW
    );
    doc.text(intro, margin, 110);

    doc.setFontSize(11);
    doc.setTextColor(100, 100, 100);
    doc.text('Dr Jonathan Rhodes', margin, H - 30);
    doc.text('University of Plymouth', margin, H - 25);
    doc.setLineWidth(0.5);
    doc.setDrawColor(200, 200, 200);
    doc.line(margin, H - 18, W - margin, H - 18);
    doc.setFontSize(9);
    doc.text(today, margin, H - 13);

    // PAGE 2 -- The Silence Problem
    doc.addPage();
    let y = margin + 5;
    y = sectionHeader('01 -- THE SILENCE PROBLEM', y, doc);
    y += 8;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(10, 15, 28);
    const p1 = doc.splitTextToSize('Think of a time at work when you had something important to say but chose not to. What stopped you?', contentW);
    doc.text(p1, margin, y);
    y += p1.length * 6 + 6;
    y = ruledLines(y, 9, doc);
    y += 10;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(10, 15, 28);
    const p2 = doc.splitTextToSize('What is the cost, to your team and your organisation, when capable people choose silence?', contentW);
    doc.text(p2, margin, y);
    y += p2.length * 6 + 6;
    ruledLines(y, 7, doc);

    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);
    doc.text('-- ' + (doc.getNumberOfPages() - 1) + ' --', W / 2, H - 10, { align: 'center' });

    // PAGE 3 -- Quadrant Framework
    doc.addPage();
    y = margin + 5;
    y = sectionHeader('FRAMEWORK -- THE SILENCE QUADRANT', y, doc);
    y += 6;

    const qLeft = margin + 10;
    const qTop = y;
    const qW = contentW - 20;
    const qH = 90;
    const midX = qLeft + qW / 2;
    const midY = qTop + qH / 2;

    doc.setDrawColor(10, 15, 28);
    doc.setLineWidth(0.5);
    doc.rect(qLeft, qTop, qW, qH);
    doc.line(midX, qTop, midX, qTop + qH);
    doc.line(qLeft, midY, qLeft + qW, midY);

    doc.setDrawColor(0, 137, 123);
    doc.setLineWidth(1.5);
    doc.rect(midX, qTop, qW / 2, qH / 2);
    doc.setDrawColor(10, 15, 28);
    doc.setLineWidth(0.5);

    const qLabels = [
      { x: qLeft + 4, y: qTop + 8, title: 'Comfortable Silence', desc: "People care but\ndon't speak." },
      { x: midX + 4,  y: qTop + 8, title: 'Psychological Safety', desc: 'People care AND\nspeak up.' },
      { x: qLeft + 4, y: midY + 8, title: 'Apathy',               desc: 'Neither care\nnor speak.' },
      { x: midX + 4,  y: midY + 8, title: 'Aggressive Culture',   desc: 'Speak up to attack,\nnot to build.' },
    ];
    qLabels.forEach(({ x, y: qy, title, desc }) => {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.setTextColor(10, 15, 28);
      doc.text(title, x, qy);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(100, 100, 100);
      doc.text(desc, x, qy + 5);
    });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(100, 100, 100);
    doc.text('NOT SPEAKING UP                                          SPEAKING UP', qLeft, qTop + qH + 6);
    doc.setTextColor(0, 137, 123);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.text('TARGET', midX + 4, qTop + 6);

    y = qTop + qH + 15;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(10, 15, 28);
    const qp = doc.splitTextToSize('Where does your team sit today? Mark it on the quadrant. What would need to change to move toward the top-right?', contentW);
    doc.text(qp, margin, y);
    y += qp.length * 6 + 6;
    ruledLines(y, 5, doc);

    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);
    doc.text('-- ' + (doc.getNumberOfPages() - 1) + ' --', W / 2, H - 10, { align: 'center' });

    // PAGE 4 -- Five Behaviours
    doc.addPage();
    y = margin + 5;
    y = sectionHeader("02 -- THE LEADER'S TOOLKIT", y, doc);
    y += 6;

    const bList = [

            style={{
              width:'48px', height:'48px',
              background:'rgba(255,255,255,0.06)',
              backdropFilter:'blur(20px)',
              WebkitBackdropFilter:'blur(20px)',
              border:'1px solid rgba(255,255,255,0.12)',
              borderRadius:'12px',
              color: btn.disabled
                ? 'rgba(255,255,255,0.2)'
                : (currentSlide === 10 ? C.darkText : C.white),
              fontSize:'18px', cursor: btn.disabled ? 'default' : 'pointer',
              display:'flex', alignItems:'center', justifyContent:'center',
              transition:'background 200ms ease, border-color 200ms ease',
              fontFamily:'DM Sans',
            }}
            onMouseEnter={e => { if (!btn.disabled) e.currentTarget.style.background='rgba(255,255,255,0.1)'; }}
            onMouseLeave={e => { e.currentTarget.style.background='rgba(255,255,255,0.06)'; }}>
            {btn.label}
          </button>
        ))}
      </div>

      {/* About Panel overlay */}
      {showAbout && (
        <div style={{
          position: 'fixed', inset: 0, zIndex: 1000,
          background: 'rgba(10,15,28,0.97)',
          backdropFilter: 'blur(30px)',
          WebkitBackdropFilter: 'blur(30px)',
          overflowY: 'auto',
          animation: 'slideInRight 500ms ease-out',
        }}>
          {/* Close button */}
          <button onClick={() => setShowAbout(false)} style={{
            position: 'sticky', top: '2rem', float: 'right', marginRight: '2.5rem',
            background: 'transparent', border: '1px solid rgba(255,255,255,0.2)',
            borderRadius: '50%', width: '40px', height: '40px',
            color: 'rgba(255,255,255,0.7)', cursor: 'pointer', fontSize: '18px',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            zIndex: 10, transition: 'border-color 200ms, color 200ms',
          }}>&#x2715;</button>

          {/* Content */}
          <div style={{ maxWidth: '800px', margin: '0 auto', padding: '4rem 2rem 6rem' }}>
            {/* About This Experience */}
            <div style={{ marginBottom: '3rem' }}>
              <div style={{ fontFamily: "'DM Sans'", fontSize: '11px', fontWeight: '500',
                letterSpacing: '0.15em', textTransform: 'uppercase', color: '#00F0D0',
                marginBottom: '1rem' }}>About This Experience</div>
              <p style={{ fontSize: '18px', color: 'rgba(255,255,255,0.85)', lineHeight: 1.7 }}>
                "From Psychological Safety to Authentic Leadership" is a facilitated workshop experience
                designed for leadership teams. It draws on peer-reviewed research in organisational
                psychology, team dynamics, and leadership science to create an evidence-based session
                that moves from understanding why people stay silent, through the science of team
                communication, to practical tools leaders can use immediately.
              </p>
              <div style={{ marginTop: '1.2rem', fontSize: '16px' }}>
                <span style={{ color: '#00F0D0' }}>Dr Jonathan Rhodes</span>
                <span style={{ color: 'rgba(255,255,255,0.5)' }}> &middot; </span>
                <span style={{ color: '#00F0D0' }}>University of Plymouth</span>
              </div>
            </div>

            <hr style={{ border: 'none', borderTop: '1px solid rgba(255,255,255,0.1)', marginBottom: '3rem' }} />

            {/* Research Foundations label */}
            <div style={{ fontFamily: "'DM Sans'", fontSize: '11px', fontWeight: '500',
              letterSpacing: '0.15em', textTransform: 'uppercase', color: '#00F0D0',
              marginBottom: '2rem' }}>RESEARCH FOUNDATIONS</div>

            {/* Research cards */}
            {researchCards.map((card, i) => (
              <div key={i} style={{
                background: 'rgba(255,255,255,0.04)',
                backdropFilter: 'blur(20px)',
                WebkitBackdropFilter: 'blur(20px)',
                border: '1px solid rgba(255,255,255,0.08)',
                borderLeft: '4px solid #00F0D0',
                borderRadius: '16px',
                padding: '2rem',
                marginBottom: '1.5rem',
              }}>
                <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: '24px', color: '#00F0D0', marginBottom: '4px' }}>
                  {card.name}
                </div>
                <div style={{ fontSize: '13px', color: '#6B7280', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: '1rem' }}>
                  {card.role}
                </div>
                <p style={{ fontSize: '16px', color: 'rgba(255,255,255,0.85)', lineHeight: 1.6, marginBottom: '1.2rem' }}>
                  {card.concept}
                </p>
                <div style={{ marginBottom: '1rem' }}>
                  {card.works.map((w, j) => (
                    <div key={j} style={{ fontSize: '14px', color: '#6B7280', fontStyle: 'italic', lineHeight: 1.6, marginBottom: '4px' }}
                      dangerouslySetInnerHTML={{ __html: w }} />
                  ))}
                </div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '12px' }}>
                  {card.links.map((lnk, j) => (
                    <a key={j} href={lnk.url} target="_blank" rel="noopener noreferrer"
                      style={{ fontSize: '13px', color: '#00F0D0', textDecoration: 'none',
                        display: 'inline-flex', alignItems: 'center', gap: '4px' }}>
                      {lnk.label} &#x2197;
                    </a>
                  ))}
                </div>
              </div>
            ))}

            <hr style={{ border: 'none', borderTop: '1px solid rgba(255,255,255,0.1)', margin: '3rem 0 2.5rem' }} />

            {/* About the Designer */}
            <div style={{ marginBottom: '2.5rem' }}>
              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: '11px', fontWeight: '500',
                letterSpacing: '0.15em', textTransform: 'uppercase', color: '#00F0D0',
                marginBottom: '1.2rem' }}>About the Designer</div>
              <div style={{ fontFamily: "'Instrument Serif', serif", fontSize: '26px', color: '#FFFFFF',
                marginBottom: '0.5rem' }}>Dr Jon Rhodes</div>
              <div style={{ fontSize: '13px', color: '#6B7280', letterSpacing: '0.08em',
                textTransform: 'uppercase', marginBottom: '1.5rem' }}>
                Performance Psychologist &amp; Co-developer, Functional Imagery Training
              </div>
              <p style={{ fontSize: '17px', color: 'rgba(255,255,255,0.8)', lineHeight: 1.75,
                marginBottom: '1rem' }}>
                Jon's work sits at the sharp end of human performance, supporting explorers, world-class
                teams, military personnel, athletes and leaders to think, adapt and act under pressure.
              </p>
              <p style={{ fontSize: '17px', color: 'rgba(255,255,255,0.8)', lineHeight: 1.75 }}>
                Through research, interviews, coaching and real-world testing, he designs practical
                leadership tools that are evidence-led, interactive and built for use. His work turns
                psychological science into experiences that help people imagine better futures, make
                clearer decisions and move from insight to action.
              </p>
              <div style={{ marginTop: '1.2rem' }}>
                <a href="https://www.plymouth.ac.uk/staff/jon-rhodes" target="_blank" rel="noopener noreferrer"
                  style={{ fontSize: '13px', color: '#00F0D0', textDecoration: 'none',
                    display: 'inline-flex', alignItems: 'center', gap: '4px' }}>
                  Dr Jon Rhodes, University of Plymouth ↗
                </a>
              </div>
            </div>

            <p style={{ fontSize: '12px', color: '#4B5563', lineHeight: 1.6, marginTop: '2rem' }}>
              All references are to peer-reviewed or institutionally published sources. For full texts, consult the referenced journals or institutional websites.
            </p>
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
